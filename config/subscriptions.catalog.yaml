# Convos subscription product catalog. Source of truth for the SKU deploy
# script (scripts/sku/apply.ts). Hand-edit, then `pnpm sku:diff` and
# `pnpm sku:apply`.
#
# Product ID template: app.convos.subs.<tier>.<period>
# Must align with src/subscriptions/product-mapping.ts PRODUCT_ID_PATTERN.
#
# Pricing is in minor units (cents): USD 999 = $9.99.

subscriptionGroupReferenceName: convos_subscriptions

products:
  - tier: plus
    period: monthly
    productId: app.convos.subs.plus.monthly
    referenceName: Convos Plus Monthly
    localizations:
      en-US:
        name: Convos Plus
        description: Monthly subscription to the Convos Plus tier.
    pricing:
      USD: 999
      EUR: 999
      GBP: 899
    google:
      basePlanId: monthly
      billingPeriod: P1M
      autoRenewingPlan: true

  - tier: plus
    period: annual
    productId: app.convos.subs.plus.annual
    referenceName: Convos Plus Annual
    localizations:
      en-US:
        name: Convos Plus (annual)
        description: Annual subscription to the Convos Plus tier.
    pricing:
      USD: 9999
      EUR: 9999
      GBP: 8999
    google:
      basePlanId: annual
      billingPeriod: P1Y
      autoRenewingPlan: true
