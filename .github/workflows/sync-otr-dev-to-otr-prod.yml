name: Sync otr-dev to otr-prod

on:
  workflow_dispatch: # Only manual triggering via GitHub UI

permissions:
  contents: write # Need write access to push to otr-prod

jobs:
  sync-branches:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need full history for merge
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate branch
        run: |
          if [ "${{ github.ref_name }}" != "otr-dev" ]; then
            echo "❌ This workflow must be run from the 'otr-dev' branch only"
            echo "Current branch: ${{ github.ref_name }}"
            echo "Expected branch: otr-dev"
            exit 1
          fi
          echo "✅ Running from correct branch: otr-dev"

      - name: Configure Git
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Fetch both branches
        run: |
          git fetch origin otr-prod:otr-prod || git fetch origin otr-prod
          git fetch origin otr-dev:otr-dev || git fetch origin otr-dev

      - name: Merge otr-dev to otr-prod (prefer fast-forward)
        id: merge
        run: |
          git checkout otr-prod
          git pull origin otr-prod # Ensure we have latest otr-prod

          # Try fast-forward first, fall back to regular merge if needed
          if git merge --ff-only origin/otr-dev 2>/dev/null; then
            echo "success=true" >> $GITHUB_OUTPUT
            echo "merge_type=fast-forward" >> $GITHUB_OUTPUT
            echo "✅ Fast-forward merge successful - clean linear history maintained"
          elif git merge origin/otr-dev --no-edit; then
            echo "success=true" >> $GITHUB_OUTPUT
            echo "merge_type=merge-commit" >> $GITHUB_OUTPUT
            echo "✅ Merge successful with merge commit (otr-prod had diverged)"
          else
            echo "success=false" >> $GITHUB_OUTPUT
            echo "❌ Merge failed due to conflicts"
            git merge --abort
          fi

      - name: Push successful merge
        if: steps.merge.outputs.success == 'true'
        run: |
          git push origin otr-prod
          echo "✅ Successfully synced otr-prod with otr-dev" >> $GITHUB_STEP_SUMMARY
          echo "**Merge Details:**" >> $GITHUB_STEP_SUMMARY
          echo "- Merge commit: \`$(git log -1 --oneline)\`" >> $GITHUB_STEP_SUMMARY
          echo "- Triggered by: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

      - name: Trigger OTR Production Deployment
        if: steps.merge.outputs.success == 'true'
        run: |
          echo "🚀 Triggering OTR Production deployment..." >> $GITHUB_STEP_SUMMARY

          # Get commit details safely
          COMMIT_HASH=$(git rev-parse HEAD)
          COMMIT_MESSAGE=$(git log -1 --pretty=%B | head -1 | sed 's/"/\\"/g' | tr '\n' ' ')

          # Create JSON payload
          JSON_PAYLOAD=$(cat <<EOF
          {
            "event_type": "deploy-otr-prod",
            "client_payload": {
              "ref": "otr-prod",
              "commit_hash": "$COMMIT_HASH",
              "commit_message": "$COMMIT_MESSAGE",
              "triggered_by": "sync-otr-dev-to-otr-prod workflow"
            }
          }
          EOF
          )

          # Send the request
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d "$JSON_PAYLOAD"

          echo "✅ Deployment trigger sent successfully" >> $GITHUB_STEP_SUMMARY

      - name: Report merge failure
        if: steps.merge.outputs.success == 'false'
        run: |
          echo "⚠️ **Merge failed due to conflicts**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**To resolve manually:**" >> $GITHUB_STEP_SUMMARY
          echo "1. \`git checkout otr-prod && git pull\`" >> $GITHUB_STEP_SUMMARY
          echo "2. \`git merge otr-dev\`" >> $GITHUB_STEP_SUMMARY
          echo "3. Resolve conflicts in your editor" >> $GITHUB_STEP_SUMMARY
          echo "4. \`git add . && git commit\`" >> $GITHUB_STEP_SUMMARY
          echo "5. \`git push origin otr-prod\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "After resolving conflicts, future syncs should work smoothly." >> $GITHUB_STEP_SUMMARY
          exit 1
